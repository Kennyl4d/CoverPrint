app-id: io.github.kennyl4d.CoverPrint
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: coverprint
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-run/gvfs
modules:
  - name: python3-pillow
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=/app .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/source/p/pillow/pillow-11.1.0.tar.gz
        sha256: 4c834a3921375c48ee6b9626b5b5f4f06d0f6b24d9a16f78c0c56a7d8f1e9b7a
  - name: coverprint
    buildsystem: simple
    build-commands:
      - install -Dm755 coverprint.py /app/bin/coverprint
      - install -Dm644 io.github.kennyl4d.CoverPrint.desktop /app/share/applications/io.github.kennyl4d.CoverPrint.desktop
      - install -Dm644 io.github.kennyl4d.CoverPrint.metainfo.xml /app/share/metainfo/io.github.kennyl4d.CoverPrint.metainfo.xml
    sources:
      - type: dir
        path: app
