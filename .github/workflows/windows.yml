name: Build Windows
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r windows/requirements.txt
      - name: Run regression tests
        run: |
          python -m pip install pypdf
          python -m unittest discover -s tests -p test_translations.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_windows.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Python syntax
        run: python -m py_compile windows/coverprint_windows.py app/translations.py
      - name: Build standalone Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name CoverPrint --add-data "app/translations.py;." windows/coverprint_windows.py
          if (!(Test-Path dist/CoverPrint/CoverPrint.exe)) { throw "Executable missing" }
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -FilePath (Resolve-Path dist/CoverPrint/CoverPrint.exe) -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) { throw "Packaged application exited during startup: $($process.ExitCode)" }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id }
          }
      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item LICENSE dist/CoverPrint/LICENSE
          Compress-Archive -Path dist/CoverPrint -DestinationPath release/CoverPrint-1.2.0-Windows-Portable.zip -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path release/CoverPrint-1.2.0-Windows-Setup.exe)) { throw "Installer missing" }
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: CoverPrint-1.2.0-Windows
          path: |
            release/CoverPrint-1.2.0-Windows-Portable.zip
            release/CoverPrint-1.2.0-Windows-Setup.exe
          if-no-files-found: error
