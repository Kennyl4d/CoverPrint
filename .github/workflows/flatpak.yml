name: Build Flatpak
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python sources
        run: python3 -m py_compile app/coverprint.py app/translations.py
      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net app/io.github.kennyl4d.CoverPrint.metainfo.xml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: CoverPrint.flatpak
          manifest-path: io.github.kennyl4d.CoverPrint.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: coverprint-v1.2.0
          path: CoverPrint.flatpak
          if-no-files-found: error