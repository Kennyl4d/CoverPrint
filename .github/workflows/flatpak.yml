name: Build Flatpak
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: CoverPrint.flatpak
          manifest-path: io.github.kennyl4d.CoverPrint.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: coverprint-v1.0.0
          path: CoverPrint.flatpak
          if-no-files-found: error
  release:
    needs: flatpak
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverprint-v1.0.0
      - name: Publish initial release once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists; not replacing it."
          else
            gh release create v1.0.0 CoverPrint.flatpak --target "$GITHUB_SHA" --title "CoverPrint 1.0.0" --notes "initial Release"
          fi
