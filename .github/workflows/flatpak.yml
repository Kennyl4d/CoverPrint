name: Build Flatpak
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: CoverPrint.flatpak
          manifest-path: io.github.kennyl4d.CoverPrint.yml
          cache-key: flatpak-builder-${{ github.sha }}
